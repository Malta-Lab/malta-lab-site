<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MALTA Lab · PUCRS</title>
  <meta name="description" content="MALTA Lab — Machine Learning Theory and Applications Lab, PUCRS." />

  <!-- Open Graph -->
  <meta property="og:title" content="MALTA Lab · PUCRS" />
  <meta property="og:description" content="Machine Learning Theory and Applications Lab — PUCRS." />
  <meta property="og:type" content="website" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>

  <!-- Particle background (decorative, never captures pointer events) -->
  <div id="particles-js-container" aria-hidden="true"></div>

  <!-- Fallback message if data fails to load -->
  <div id="app-error" hidden style="position:fixed;top:0;left:0;right:0;background:#C8362A;color:#fff;padding:8px;text-align:center;z-index:100;font-size:14px;">
    Failed to load lab data. Please refresh the page.
  </div>

  <!-- ========== Header ========== -->
  <header class="site-header">
    <nav class="container-narrow" style="display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:0.85rem 1rem;">
      <a href="#inicio" id="brand" class="brand-mark" aria-label="MALTA Lab"></a>

      <div id="nav-desktop" class="nav-desktop" style="display:none;align-items:center;gap:1.1rem;"></div>

      <div style="display:flex;align-items:center;gap:0.5rem;">
        <div id="theme-toggle" class="lang-toggle" role="group" aria-label="Theme"></div>
        <div id="lang-toggle" class="lang-toggle" role="group" aria-label="Language"></div>
        <button id="mobile-menu-button" class="mobile-menu-btn" aria-label="Open menu" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </nav>

    <div id="mobile-menu">
      <div id="mobile-menu-list" class="container-narrow" style="padding:0.5rem 1rem 1rem;"></div>
    </div>
  </header>

  <!-- ========== Hero ========== -->
  <main>
    <section id="inicio" style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:5rem 1rem 4rem;">
      <div class="container-narrow" style="text-align:center;">
        <img id="hero-logo" src="./img/logo.png" alt="MALTA — Machine Learning Theory and Applications Lab"
             style="max-width:520px;width:100%;height:auto;margin:0 auto;display:block;" />

        <a id="kunumi-link" href="https://kunumi.com" target="_blank" rel="noopener noreferrer" class="kunumi-mark" aria-label="Kunumi Institute">
          <img id="kunumi-logo" src="./img/kunumi_positivo.png" alt="Kunumi Institute"
               style="max-width:260px;width:100%;height:auto;margin:0.75rem auto 0;display:block;" />
        </a>

        <p id="hero-tagline" style="margin-top:1.75rem;color:var(--ink-soft);font-size:1.05rem;line-height:1.55;max-width:600px;margin-inline:auto;"></p>

        <div id="hero-stats" class="stats-row" style="margin-top:2rem;"></div>

        <div id="hero-ctas" style="margin-top:2rem;display:flex;flex-wrap:wrap;justify-content:center;gap:0.75rem;"></div>
      </div>
    </section>

    <!-- ========== Sobre — 2-column for visual variety (item 10) ========== -->
    <section id="sobre" class="section">
      <div class="container-narrow">
        <div class="about-grid">
          <div>
            <span class="eyebrow" id="sobre-eyebrow"></span>
            <h2 id="sobre-title" class="h-display" style="font-size:clamp(1.8rem,3.2vw,2.4rem);margin-top:0.5rem;line-height:1.15;"></h2>
            <p id="sobre-body" style="margin-top:1.25rem;color:var(--ink-soft);font-size:1.05rem;line-height:1.65;"></p>
            <div id="sobre-venues" class="venue-cloud"></div>
          </div>
          <div id="sobre-highlights" class="highlight-list"></div>
        </div>
      </div>
    </section>

    <!-- ========== Linhas de Pesquisa ========== -->
    <section id="pesquisa" class="section" style="background:var(--elev-1);border-block:1px solid var(--border);">
      <div class="container-narrow">
        <header class="section-header">
          <span class="eyebrow" id="pesquisa-eyebrow"></span>
          <h2 id="pesquisa-title"></h2>
          <p id="pesquisa-body"></p>
        </header>
        <div id="pesquisa-grid" class="research-grid">
          <p class="loading">…</p>
        </div>
      </div>
    </section>

    <!-- ========== Membros ========== -->
    <section id="membros" class="section">
      <div class="container-narrow">
        <header class="section-header">
          <span class="eyebrow" id="membros-eyebrow"></span>
          <h2 id="membros-title"></h2>
        </header>

        <h3 id="membros-coord-label" style="font-size:1rem;font-weight:700;color:var(--ink-mute);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:1.25rem;"></h3>
        <div id="coord-grid" class="coord-grid">
          <p class="loading">…</p>
        </div>

        <h3 id="membros-pos-label" style="font-size:1rem;font-weight:700;color:var(--ink-mute);letter-spacing:0.08em;text-transform:uppercase;margin:3rem 0 1.25rem;"></h3>
        <div id="alunos-grid" class="student-grid">
          <p class="loading">…</p>
        </div>

        <div id="alunos-graduacao-wrap" hidden>
          <h3 id="membros-grad-label" style="font-size:1rem;font-weight:700;color:var(--ink-mute);letter-spacing:0.08em;text-transform:uppercase;margin:3rem 0 1.25rem;"></h3>
          <div id="alunos-graduacao-grid" class="student-grid"></div>
        </div>
      </div>
    </section>

    <!-- ========== Publicações (filters, not pagination — item 11) ========== -->
    <section id="publicacoes" class="section" style="background:var(--elev-1);border-block:1px solid var(--border);">
      <div class="container-narrow" style="max-width:980px;">
        <header class="section-header">
          <span class="eyebrow" id="pubs-eyebrow"></span>
          <h2 id="pubs-title"></h2>
          <p id="pubs-body"></p>
        </header>

        <div class="pub-controls">
          <div class="pub-filter-group">
            <span class="label" id="pub-year-label"></span>
            <div id="pub-year-chips" style="display:flex;flex-wrap:wrap;gap:0.4rem;"></div>
          </div>
          <div class="pub-filter-group">
            <span class="label" id="pub-type-label"></span>
            <div id="pub-type-chips" style="display:flex;flex-wrap:wrap;gap:0.4rem;"></div>
          </div>
          <span class="pub-meta" id="pub-count"></span>
        </div>

        <div id="pub-list" class="pub-list">
          <p class="loading">…</p>
        </div>
      </div>
    </section>

    <!-- ========== Notícias (item 20) ========== -->
    <section id="noticias" class="section">
      <div class="container-narrow" style="max-width:820px;">
        <header class="section-header">
          <span class="eyebrow" id="noticias-eyebrow"></span>
          <h2 id="noticias-title"></h2>
          <p id="noticias-body"></p>
        </header>
        <div id="noticias-list" class="news-list">
          <p class="loading">…</p>
        </div>
      </div>
    </section>

    <!-- ========== Contato ========== -->
    <section id="contato" class="section" style="background:var(--elev-1);border-block:1px solid var(--border);">
      <div class="container-narrow">
        <header class="section-header">
          <span class="eyebrow" id="contato-eyebrow"></span>
          <h2 id="contato-title"></h2>
          <p id="contato-body"></p>
        </header>

        <div class="contact-grid">
          <div>
            <div class="contact-block" style="margin-bottom:2rem;">
              <h3 id="addr-label"></h3>
              <div id="addr-lines"></div>
            </div>
            <div id="social-wrap" class="contact-block" hidden>
              <h3 id="social-label"></h3>
              <div id="social-links" style="display:flex;gap:1.25rem;"></div>
            </div>
          </div>

          <div class="contact-cta">
            <div id="emails" class="stack"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ========== Footer ========== -->
  <footer>
    <div class="container-narrow" style="padding:2.5rem 1rem;display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center;">
      <div>
        <strong style="color:var(--ink);font-size:1rem;">MALTA Lab</strong>
        <p id="footer-tagline" style="font-size:0.85rem;color:var(--ink-mute);"></p>
      </div>
      <div style="font-size:0.85rem;text-align:right;">
        <p id="footer-copy"></p>
        <p style="margin-top:0.25rem;">
          <a id="footer-link" href="#" target="_blank" rel="noopener noreferrer" style="color:var(--ink-mute);text-decoration:none;border-bottom:1px dotted var(--border-strong);"></a>
        </p>
      </div>
    </div>
  </footer>

  <!-- Inline rules that piggy-back on tokens already in styles.css -->
  <style>
    @media (min-width: 880px) {
      #nav-desktop { display: flex !important; }
      .mobile-menu-btn { display: none !important; }
    }
    .mobile-menu-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--ink-soft); padding: 6px 10px;
      border-radius: var(--radius-sm); cursor: pointer;
    }
    .mobile-menu-btn:hover { color: var(--ink); }
    #mobile-menu {
      display: none;
    }
    #mobile-menu.is-open { display: block; }
    @media (min-width: 880px) {
      #mobile-menu { display: none !important; }
    }
    /* Brand subtitle: only shows on wide screens so it never crowds the nav */
    .brand-mark .brand-sub { display: none; }
    @media (min-width: 1180px) {
      .brand-mark .brand-sub { display: inline; }
    }
  </style>

  <!-- particles.js (decorative; pointer events off, init is in app.js so it can follow the theme) -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <!-- App -->
  <script src="./js/app.js" defer></script>

</body>
</html>
