<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MALTA Lab · PUCRS</title>
  <meta name="description" content="MALTA Lab — Machine Learning Theory and Applications Lab, PUCRS." />
  <meta name="theme-color" content="#F3EFED" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1A1816" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="./img/favicon.svg" type="image/svg+xml" />

  <!-- Open Graph -->
  <meta property="og:title" content="MALTA Lab · PUCRS" />
  <meta property="og:description" content="Machine Learning Theory and Applications Lab — PUCRS." />
  <meta property="og:type" content="website" />

  <!-- Fonts: Archivo (display), Atkinson Hyperlegible Next (body) and Mono (labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Atkinson+Hyperlegible+Mono:wght@400..600&family=Atkinson+Hyperlegible+Next:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/styles.css" />

  <!-- Apply saved / system theme before first paint (avoids a flash of wrong colors) -->
  <script>
    (function () {
      let initial = null;
      try { initial = localStorage.getItem("malta_theme"); } catch (e) { /* storage blocked */ }
      if (initial !== "light" && initial !== "dark") {
        initial = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", initial);
    })();
  </script>
</head>

<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <!-- Background network: one cluster per research area (decorative, never captures pointer events) -->
  <canvas id="bg-network" aria-hidden="true"></canvas>

  <!-- Fallback message if data fails to load -->
  <div id="app-error" class="app-error" hidden>
    Failed to load lab data. Please refresh the page.
  </div>

  <!-- ========== Header ========== -->
  <header class="site-header">
    <nav class="container-narrow header-bar">
      <a href="#inicio" id="brand" class="brand-mark" aria-label="MALTA Lab"></a>

      <div id="nav-desktop" class="nav-desktop"></div>

      <div class="header-tools">
        <div id="theme-toggle" class="lang-toggle" role="group" aria-label="Theme"></div>
        <div id="lang-toggle" class="lang-toggle" role="group" aria-label="Language"></div>
        <button id="mobile-menu-button" class="mobile-menu-btn" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </nav>

    <div id="mobile-menu">
      <div id="mobile-menu-list" class="container-narrow mobile-menu-list"></div>
    </div>
  </header>

  <main id="conteudo">
    <!-- ========== Hero: the wordmark, with the background as the figure ========== -->
    <section id="inicio" class="hero">
      <div class="container-narrow hero-grid">
        <div class="hero-main">
          <h1 class="wordmark">
            <span class="wordmark-lockup">
              <span class="wordmark-word">MALTA</span>
              <span class="wordmark-bar" aria-hidden="true"></span>
            </span>
            <span class="wordmark-name" id="hero-name">Machine Learning Theory and Applications Lab</span>
          </h1>

          <p id="hero-tagline" class="hero-tagline"></p>

          <div id="hero-ctas" class="hero-ctas"></div>

          <div class="hero-stats">
            <div id="hero-stats" class="hero-stat-list"></div>
            <a id="kunumi-link" href="https://www.kunuminst.org/" target="_blank" rel="noopener noreferrer" class="kunumi-mark" aria-label="Kunumi Institute">
              <img id="kunumi-logo" src="./img/kunumi_positivo.png" alt="Kunumi Institute" width="6728" height="2026" />
            </a>
          </div>
        </div>

        <!-- Legend for the background: one colour per research area -->
        <nav id="hero-legend" class="hero-legend" aria-labelledby="legend-title"></nav>
      </div>
    </section>

    <!-- ========== Sobre ========== -->
    <section id="sobre" class="section">
      <div class="container-narrow about-grid">
        <div class="about-copy">
          <span class="eyebrow" id="sobre-eyebrow"></span>
          <h2 id="sobre-title" class="h-display about-title"></h2>
          <p id="sobre-body" class="about-body"></p>
          <div id="sobre-venues" class="venue-cloud"></div>
        </div>
        <div id="sobre-highlights" class="highlight-list"></div>
      </div>
    </section>

    <!-- ========== Linhas de Pesquisa ========== -->
    <section id="pesquisa" class="section">
      <div class="container-narrow">
        <header class="section-header">
          <span class="eyebrow" id="pesquisa-eyebrow"></span>
          <h2 id="pesquisa-title"></h2>
          <p id="pesquisa-body"></p>
        </header>
        <div id="pesquisa-grid" class="research-grid">
          <p class="loading">…</p>
        </div>
      </div>
    </section>

    <!-- ========== Membros ========== -->
    <section id="membros" class="section">
      <div class="container-narrow">
        <header class="section-header">
          <span class="eyebrow" id="membros-eyebrow"></span>
          <h2 id="membros-title"></h2>
        </header>

        <h3 id="membros-coord-label" class="team-group-label is-first"></h3>
        <div id="coord-grid" class="coord-grid">
          <p class="loading">…</p>
        </div>

        <h3 id="membros-pos-label" class="team-group-label"></h3>
        <div id="alunos-grid" class="student-grid">
          <p class="loading">…</p>
        </div>

        <div id="alunos-graduacao-wrap" hidden>
          <h3 id="membros-grad-label" class="team-group-label"></h3>
          <div id="alunos-graduacao-grid" class="student-grid"></div>
        </div>
      </div>
    </section>

    <!-- ========== Publicações ========== -->
    <section id="publicacoes" class="section">
      <div class="container-narrow">
        <header class="section-header">
          <span class="eyebrow" id="pubs-eyebrow"></span>
          <h2 id="pubs-title"></h2>
          <p id="pubs-body"></p>
        </header>

        <div class="pub-controls">
          <div class="pub-filter-group">
            <span class="label" id="pub-year-label"></span>
            <div id="pub-year-chips" class="chip-row" role="group" aria-labelledby="pub-year-label"></div>
          </div>
          <div class="pub-filter-group">
            <span class="label" id="pub-type-label"></span>
            <div id="pub-type-chips" class="chip-row" role="group" aria-labelledby="pub-type-label"></div>
          </div>
          <span class="pub-meta" id="pub-count" aria-live="polite"></span>
        </div>

        <div id="pub-list" class="pub-list">
          <p class="loading">…</p>
        </div>
      </div>
    </section>

    <!-- ========== Notícias ========== -->
    <section id="noticias" class="section">
      <div class="container-narrow news-layout">
        <header class="section-header">
          <span class="eyebrow" id="noticias-eyebrow"></span>
          <h2 id="noticias-title"></h2>
          <p id="noticias-body"></p>
        </header>
        <div class="card news-panel">
          <div id="noticias-list" class="news-list">
            <p class="loading">…</p>
          </div>
        </div>
        <div id="noticias-more" class="news-more"></div>
      </div>
    </section>

    <!-- ========== Contato ========== -->
    <section id="contato" class="section">
      <div class="container-narrow">
        <header class="section-header">
          <span class="eyebrow" id="contato-eyebrow"></span>
          <h2 id="contato-title"></h2>
          <p id="contato-body"></p>
        </header>

        <div class="contact-grid">
          <div class="card">
            <div class="contact-block">
              <h3 id="addr-label"></h3>
              <div id="addr-lines"></div>
            </div>
            <div id="social-wrap" class="contact-block" hidden>
              <h3 id="social-label"></h3>
              <div id="social-links" class="social-links"></div>
            </div>
          </div>

          <div class="card contact-cta">
            <div id="emails" class="stack"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ========== Footer ========== -->
  <footer class="site-footer">
    <div class="container-narrow footer-bar">
      <div class="footer-brand">
        <span class="brand-lockup" aria-hidden="true"><span class="brand-word">MALTA Lab</span><span class="brand-bar"></span></span>
        <p id="footer-tagline" class="footer-tagline"></p>
      </div>
      <div class="footer-meta">
        <p id="footer-copy"></p>
        <p><a id="footer-link" class="footer-link" href="#" target="_blank" rel="noopener noreferrer"></a></p>
      </div>
    </div>
  </footer>

  <!-- App -->
  <script src="./js/network.js" defer></script>
  <script src="./js/core.js" defer></script>
  <script src="./js/app.js" defer></script>

</body>
</html>
